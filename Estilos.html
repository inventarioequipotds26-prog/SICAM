<style>
/* =====================================================================
   SICAM · Hoja de estilos principal (css/Estilos)
   Estilo "plano técnico": papel cuadriculado, bordes de tinta y sombras
   duras, siempre con la paleta azul de SICAM y su logo.
   Todo el color sale de variables (tokens), así el modo oscuro
   solo cambia los valores, no las reglas.

   Índice
     1. Tokens (claro / oscuro)        9. Inventario y tablas
     2. Base y utilidades             10. Formularios y chips
     3. Íconos y botones              11. Escáner, auditoría y reporte
     4. Menú lateral                  12. Mapa 2D
     5. Barra superior y buscador     13. Gestión
     6. Encabezados de vista          14. Préstamos
     7. Inicio (bento)                15. Modales, paleta, aviso (toast)
     8. Tarjetas y KPIs               16. Guía, pie, dock móvil, login
     8b. Logo y vistas por rol         17. Responsivo   18. Impresión
   ===================================================================== */

/* ---------- 1. TOKENS ---------- */
:root {
  --fuente: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --fuente-titulo: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, monospace;

  /* Paleta oficial de SICAM: solo azules (de la muestra entregada) + blanco.
     Única excepción: verde, naranja y rojo para Bueno, Regular y Dañado,
     porque son señales universales que todos entienden al instante. */
  --marino: #01265d;          /* azul del logo */
  --noche: #00101d;
  --papel: #eef3f8;
  --cuadricula: rgba(9, 30, 47, .05);
  --superficie: #ffffff;
  --superficie-2: #e6edf4;
  --superficie-3: #d7e2ec;
  --tinta: #091e2f;
  --tinta-2: #314252;
  --tenue: #48647a;
  --linea: #c9d6e2;
  --borde: #103b5e;

  --primario: #1b76bd;
  --primario-hover: #15588f;
  --primario-suave: #dbe8f3;
  --sobre-primario: #ffffff;
  --acento: #4a91c9;
  --acento-suave: #dbe8f3;
  --sobre-acento: #00101d;

  --ok: #13a35a;          --ok-suave: #dcf5e7;      --ok-tinta: #0b6b3a;
  --aviso: #ee8a0a;       --aviso-suave: #fdebd1;   --aviso-tinta: #8a4a00;
  --peligro: #e5383b;     --peligro-suave: #fde0e0; --peligro-tinta: #9b1c1f;
  --mant: #38668a;        --mant-suave: #e1e9f0;    --mant-tinta: #1e3344;
  --prestado: #4a91c9;    --prestado-suave: #dbe8f3; --prestado-tinta: #15588f;
  --baja: #48647a;        --baja-suave: #e4e8ec;    --baja-tinta: #182128;

  --menu-fondo: #041f3a;
  --menu-texto: #9db2c3;
  --menu-tenue: #86a1bc;
  --menu-grupo: #6085a2;
  --menu-linea: rgba(157, 178, 195, .16);
  --hero-fondo: #01265d;
  --logo-oscuro: #01265d;
  --logo-claro: #3c6aa1;

  --sombra-dura: 4px 4px 0 var(--borde);
  --sombra-dura-sm: 2px 2px 0 var(--borde);
  --sombra-suave: 0 10px 30px -12px rgba(22, 26, 46, .25);
  --radio: 16px;
  --radio-sm: 10px;
  --ancho-menu: 264px;
  --alto-barra: 68px;
  --transicion: .18s cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}

[data-theme="oscuro"] {
  --papel: #00101d;
  --cuadricula: rgba(157, 178, 195, .04);
  --superficie: #091e2f;
  --superficie-2: #0c1922;
  --superficie-3: #1e3344;
  --tinta: #eef3f8;
  --tinta-2: #9db2c3;
  --tenue: #86a1bc;
  --linea: #1e3344;
  --borde: #2b4d68;

  --primario: #4a91c9;
  --primario-hover: #6a8ca7;
  --primario-suave: #053053;
  --sobre-primario: #00101d;
  --acento: #4a91c9;
  --acento-suave: #06406e;

  --ok: #3fd486;          --ok-suave: #143425;      --ok-tinta: #7ee7b0;
  --aviso: #ffab40;       --aviso-suave: #3a2a12;   --aviso-tinta: #ffc880;
  --peligro: #ff6b6e;     --peligro-suave: #3d1a1d; --peligro-tinta: #ffa3a5;
  --mant: #6085a2;        --mant-suave: #1e3344;    --mant-tinta: #9db2c3;
  --prestado: #4a91c9;    --prestado-suave: #06406e; --prestado-tinta: #9db2c3;
  --baja: #6a8ca7;        --baja-suave: #182128;    --baja-tinta: #9db2c3;

  --hero-fondo: #053053;
  --logo-oscuro: #ffffff;
  --logo-claro: #4a91c9;
  --menu-fondo: #00101d;
  --sombra-dura: 4px 4px 0 rgba(0, 0, 0, .55);
  --sombra-dura-sm: 2px 2px 0 rgba(0, 0, 0, .55);
  --sombra-suave: 0 14px 34px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

/* ---------- 2. BASE Y UTILIDADES ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--fuente);
  font-size: 15px;
  line-height: 1.5;
  color: var(--tinta);
  background-color: var(--papel);
  background-image:
    linear-gradient(var(--cuadricula) 1px, transparent 1px),
    linear-gradient(90deg, var(--cuadricula) 1px, transparent 1px);
  background-size: 28px 28px;
  min-height: 100vh;
  transition: background-color var(--transicion), color var(--transicion);
}
h1, h2, h3, h4 { font-family: var(--fuente-titulo); letter-spacing: -.02em; line-height: 1.15; color: var(--tinta); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
button:disabled { cursor: not-allowed; opacity: .55; }
a { color: var(--primario); }
img { max-width: 100%; }
code, kbd { font-family: var(--mono); font-size: .86em; }
kbd {
  display: inline-block; padding: 1px 6px; border-radius: 6px;
  background: var(--superficie-2); border: 1px solid var(--linea); border-bottom-width: 2px; color: var(--tinta-2);
}
abbr[title] { text-decoration: none; color: var(--peligro); }
:focus-visible { outline: 3px solid var(--primario); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--acento); color: var(--sobre-acento); }

.hidden { display: none !important; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-12 { margin-bottom: 12px; }

/* Barras dibujadas por JS: el ancho llega en data-w y se aplica con JS (sin estilos en línea) */
.relleno { display: block; height: 100%; width: 0; transition: width .6s cubic-bezier(.2, .8, .2, 1); }

/* ---------- 3. ÍCONOS Y BOTONES ---------- */
.ic {
  width: 20px; height: 20px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--tinta); background: var(--superficie); border: 1.5px solid var(--linea);
  transition: transform var(--transicion), background var(--transicion), border-color var(--transicion);
}
.icon-btn:hover { border-color: var(--borde); transform: translateY(-1px); }

.primary-button, .secondary-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 9px 18px; border-radius: 12px;
  font-weight: 700; font-size: 14px; white-space: nowrap;
  transition: transform var(--transicion), box-shadow var(--transicion), background var(--transicion), border-color var(--transicion);
}
.primary-button {
  background: var(--primario); color: var(--sobre-primario);
  border: 1.5px solid var(--borde); box-shadow: var(--sombra-dura-sm);
}
.primary-button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: var(--sombra-dura); background: var(--primario-hover); }
.primary-button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
.secondary-button { background: var(--superficie); color: var(--tinta); border: 1.5px solid var(--linea); }
.secondary-button:hover:not(:disabled) { border-color: var(--borde); background: var(--superficie-2); }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn-peligro { background: var(--peligro); color: #fff; }
.btn-peligro:hover:not(:disabled) { background: var(--peligro); filter: brightness(1.06); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-ok:hover:not(:disabled) { background: var(--ok); filter: brightness(1.06); }
[data-theme="oscuro"] .btn-ok, [data-theme="oscuro"] .btn-peligro { color: var(--noche); }
.link-btn { color: var(--primario); text-decoration: underline; font-size: 13px; font-weight: 600; }

.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.action-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 9px;
  font-size: 12px; font-weight: 700; color: var(--tinta); background: var(--superficie-2); border: 1px solid var(--linea);
  transition: border-color var(--transicion), background var(--transicion);
}
.action-btn .ic { width: 15px; height: 15px; }
.action-btn:hover { border-color: var(--borde); }
.action-btn-ok { background: var(--ok-suave); color: var(--ok-tinta); border-color: transparent; }
.btn-reparado {
  flex: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 800;
  background: var(--ok-suave); color: var(--ok-tinta);
}
.btn-reparado:hover { filter: brightness(.97); }

/* ---------- 4. MENÚ LATERAL ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--ancho-menu); z-index: 60;
  display: flex; flex-direction: column; gap: 10px; padding: 22px 16px 16px;
  background: var(--menu-fondo); color: var(--menu-texto);
  border-right: 1.5px solid var(--borde);
  transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 14px; border-bottom: 1px solid var(--menu-linea); }
.brand h2 { color: #fff; font-size: 21px; letter-spacing: .02em; }
.brand p { font-size: 11.5px; color: var(--menu-tenue); }
/* En el menú (siempre oscuro) el logo va en blanco y azul claro */
.sidebar { --logo-oscuro: #ffffff; --logo-claro: #4a91c9; }
.brand p { margin-top: 4px; }
.cerrar-menu { display: none; margin-left: auto; background: transparent; color: #fff; border-color: var(--menu-linea); }

.navigation { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; scrollbar-width: thin; }
.nav-grupo {
  font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--menu-grupo); padding: 14px 12px 6px;
}
.navigation .nav-link {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: 12px; text-align: left;
  color: var(--menu-texto); font-weight: 600; font-size: 14px;
  transition: background var(--transicion), color var(--transicion), transform var(--transicion);
}
.navigation .nav-link:hover { background: rgba(255, 255, 255, .06); color: #fff; transform: translateX(2px); }
.navigation .nav-link.active {
  background: var(--acento); color: var(--noche); font-weight: 800;
  box-shadow: 3px 3px 0 rgba(255, 255, 255, .9);
}
.navigation .nav-link.active .ic { stroke-width: 2.3; }
.nav-badge {
  margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px;
  display: inline-grid; place-items: center; font-size: 11px; font-weight: 800;
  background: var(--peligro); color: #fff; animation: latido 2s ease-in-out infinite;
}
@keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.user-info {
  display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px;
  background: rgba(255, 255, 255, .05); border: 1px solid var(--menu-linea);
}
.user-avatar {
  width: 38px; height: 38px; border-radius: 12px; flex: none; overflow: hidden;
  display: grid; place-items: center; font-weight: 800; color: var(--noche); background: var(--acento);
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.user-name { color: #fff; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-role { font-size: 11px; color: var(--menu-tenue); text-transform: capitalize; }
.logout-btn { width: 36px; height: 36px; background: transparent; color: var(--menu-texto); border-color: var(--menu-linea); }
.logout-btn:hover { color: #fff; background: var(--peligro); border-color: var(--peligro); }
.menu-velo { display: none; }

/* ---------- 8b. LOGO Y VISTAS POR ROL ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.logo { display: inline-flex; align-items: center; gap: 8px; line-height: 1; }
.logo-marca { width: auto; height: 30px; aspect-ratio: 262 / 290; flex: none; stroke: none; }
.logo-o { fill: var(--logo-oscuro); }
.logo-c { fill: var(--logo-claro); }
.logo-txt { font-family: 'Montserrat', var(--fuente-titulo); font-weight: 800; font-size: 25px; letter-spacing: .01em; color: var(--logo-oscuro); }

/* Cada elemento con data-solo="admin directivo usuario" solo se ve para esos roles.
   La clase del <body> (rol-admin, rol-directivo o rol-usuario) la pone js/App al iniciar sesión.
   Esto solo ordena la pantalla: la seguridad real está en el servidor (server/Sesion.gs). */
body:not(.rol-admin):not(.rol-directivo):not(.rol-usuario) [data-solo],
body.rol-usuario [data-solo]:not([data-solo~="usuario"]),
body.rol-directivo [data-solo]:not([data-solo~="directivo"]),
body.rol-admin [data-solo]:not([data-solo~="admin"]) { display: none !important; }

.rol-chip {
  display: inline-flex; align-items: center; gap: 5px; width: max-content; padding: 2px 9px; border-radius: 999px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
}
.rol-chip-admin { background: #4a91c9; color: #00101d; }
.rol-chip-directivo { background: #9db2c3; color: #00101d; }
.rol-chip-usuario { background: #1e3344; color: #9db2c3; border: 1px solid #38668a; }
.hero-rol {
  display: inline-block; margin-top: 2px; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase; background: rgba(157, 178, 195, .18); color: #dbe8f3;
}
.nota-rol {
  margin-top: 10px; padding: 8px 12px; border-radius: var(--radio-sm); font-size: 13px;
  background: var(--primario-suave); color: var(--tinta-2); border-left: 4px solid var(--primario);
}
.roles-guia { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.rol-card { padding: 12px 14px; border-radius: var(--radio-sm); background: var(--superficie-2); border: 1px solid var(--linea); }
.rol-card p { margin-top: 8px; font-size: 13px; color: var(--tinta-2); }
.rol-select { min-width: 150px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--linea); background: var(--superficie); }
.rol-yo { font-size: 12px; color: var(--tenue); }

/* ---------- 5. BARRA SUPERIOR Y BUSCADOR ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; margin-left: var(--ancho-menu);
  height: var(--alto-barra); display: flex; align-items: center; gap: 12px; padding: 0 32px;
  background: color-mix(in srgb, var(--papel) 82%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linea);
}
.menu-toggle { display: none; }
.buscador {
  flex: 1; min-width: 0; max-width: 560px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px;
  border-radius: 14px; background: var(--superficie); border: 1.5px solid var(--linea); color: var(--tenue);
  font-size: 14px; text-align: left; transition: border-color var(--transicion), box-shadow var(--transicion);
}
.buscador span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.buscador:hover { border-color: var(--borde); box-shadow: var(--sombra-dura-sm); }
.topbar-acciones { margin-left: auto; display: flex; gap: 8px; }
.ic-sol { display: none; }
[data-theme="oscuro"] .ic-sol { display: block; }
[data-theme="oscuro"] .ic-luna { display: none; }

/* ---------- 6. CONTENIDO Y ENCABEZADOS DE VISTA ---------- */
.main-content { margin-left: var(--ancho-menu); padding: 28px 32px 40px; max-width: 1480px; }
.vista { display: none; }
.vista.activa { display: block; animation: entra .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.top-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
.header-text { max-width: 720px; }
.header-text h1 { font-size: clamp(28px, 3.4vw, 40px); margin: 4px 0 8px; }
.header-description { color: var(--tinta-2); font-size: 14.5px; }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.section-label {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--tinta-2); background: var(--acento-suave); padding: 3px 8px; border-radius: 6px;
}
[data-theme="oscuro"] .section-label { color: var(--acento); }

/* ---------- 7. INICIO (BENTO) ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.bento > * { grid-column: span 4; }
.bento > .tile-hero { grid-column: span 8; }
.bento > .dash-metrics { grid-column: span 4; }
.bento > .tile-ancho { grid-column: span 8; }
.bento > .tile:last-child { grid-column: 1 / -1; }
/* Vista de usuario: sin préstamos ni presupuesto, las tarjetas se reparten el ancho */
@media (min-width: 1025px) {
  body.rol-usuario .bento > .tile:not(.tile-hero):not(.tile-ancho):not(:last-child) { grid-column: span 6; }
  body.rol-usuario .bento > .tile-ancho { grid-column: 1 / -1; }
}

.tile, .card-panel, .dash-card, .products-card {
  background: var(--superficie); border: 1.5px solid var(--borde); border-radius: var(--radio);
  box-shadow: var(--sombra-dura);
}
.tile { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tile-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tile-head h2 { font-size: 18px; margin-top: 6px; }

.tile-hero {
  position: relative; overflow: hidden; flex-direction: row; align-items: center; justify-content: space-between; gap: 24px;
  padding: 30px 32px; color: #fff; background: var(--hero-fondo);
  background-image:
    linear-gradient(rgba(255, 255, 255, .09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .09) 1px, transparent 1px);
  background-size: 22px 22px, 22px 22px;
}
.tile-hero h1 { color: #fff; font-size: clamp(26px, 3vw, 38px); margin: 6px 0 8px; }
.hero-texto { position: relative; z-index: 1; min-width: 0; }
.hero-fecha {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  background: var(--noche); color: var(--acento); padding: 4px 10px; border-radius: 8px;
}
.hero-desc { color: rgba(255, 255, 255, .88); max-width: 440px; }
.hero-acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.hero-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px;
  background: #fff; color: var(--noche); font-weight: 800; font-size: 14px;
  border: 1.5px solid var(--noche); box-shadow: 3px 3px 0 var(--noche);
  transition: transform var(--transicion), box-shadow var(--transicion);
}
.hero-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--noche); }
.hero-btn:first-child { background: var(--acento); }

.dash-health { position: relative; z-index: 1; flex: none; text-align: center; color: #fff; }
.health-ring { position: relative; width: 148px; height: 148px; margin: 0 auto 8px; }
.health-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(255, 255, 255, .22); stroke-width: 9; }
.ring-fill { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2, .8, .2, 1), stroke .3s; }
.ring-fill.ring-alta { stroke: #7cf0b3; }
.ring-fill.ring-media { stroke: var(--acento); }
.ring-fill.ring-baja { stroke: #ff9a9c; }
.health-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2px; }
.health-pct strong { font-family: var(--fuente-titulo); font-size: 42px; line-height: 1; }
.health-pct small { font-size: 16px; font-weight: 700; opacity: .8; margin-top: 8px; }
.health-label { font-weight: 800; font-size: 14px; }
.health-sub { font-size: 12px; opacity: .85; }

.dash-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.metric-pill {
  position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 120px;
  padding: 16px; border-radius: var(--radio); background: var(--superficie);
  border: 1.5px solid var(--borde); box-shadow: var(--sombra-dura);
  transition: transform var(--transicion);
}
.metric-pill:hover { transform: rotate(-1deg) translateY(-2px); }
.metric-ic {
  position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 11px;
  display: grid; place-items: center; background: var(--primario-suave); color: var(--primario);
}
.metric-num { font-family: var(--fuente-titulo); font-size: 34px; font-weight: 700; line-height: 1; }
.metric-lbl { font-size: 12.5px; font-weight: 700; color: var(--tinta-2); }
.pill-ok .metric-ic { background: var(--ok-suave); color: var(--ok); }
.pill-warn .metric-ic { background: var(--aviso-suave); color: var(--aviso); }
.pill-alert { background: var(--acento); }
.pill-alert .metric-num, .pill-alert .metric-lbl { color: var(--noche); }
.pill-alert .metric-ic { background: var(--noche); color: var(--acento); }

.chart-donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-rel { position: relative; width: 150px; height: 150px; flex: none; }
.chart-donut { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-ring { fill: transparent; stroke: var(--superficie-2); stroke-width: 4.5; }
.donut-seg { fill: transparent; stroke-width: 4.5; transition: stroke-dasharray .6s; }
.seg-bueno { stroke: var(--ok); }
.seg-regular { stroke: var(--aviso); }
.seg-danado { stroke: var(--peligro); }
.seg-mantenimiento { stroke: var(--mant); }
.chart-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.chart-donut-center strong { font-family: var(--fuente-titulo); font-size: 28px; line-height: 1; }
.chart-donut-center small { font-size: 11px; color: var(--tenue); font-weight: 700; }
.donut-leyenda { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.leyenda-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta-2); }
.leyenda-row b { margin-left: auto; color: var(--tinta); font-size: 12.5px; }

.dot { display: inline-block; width: 11px; height: 11px; border-radius: 4px; flex: none; }
.dot-bueno { background: var(--ok); }
.dot-regular { background: var(--aviso); }
.dot-danado { background: var(--peligro); }
.dot-mantenimiento { background: var(--mant); }
.dot-prestado { background: var(--prestado); }
.dot-vacia { background: var(--superficie-2); border: 1.5px dashed var(--tenue); }

.barras-list { display: flex; flex-direction: column; gap: 12px; }
.barra-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 5px; }
.barra-lbl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra-val { font-family: var(--fuente-titulo); font-weight: 700; }
.barra-track { height: 10px; border-radius: 6px; background: var(--superficie-2); overflow: hidden; }
.barra-fill { border-radius: 6px; background: var(--primario); }
.barra-item:nth-child(2) .barra-fill { background: var(--prestado); }
.barra-item:nth-child(3) .barra-fill { background: var(--mant); }
.barra-item:nth-child(4) .barra-fill { background: var(--aviso); }
.barra-item:nth-child(5) .barra-fill { background: var(--ok); }

.dash-prest { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dash-prest div { padding: 12px 14px; border-radius: 12px; background: var(--prestado-suave); color: var(--prestado-tinta); }
.dash-prest div.vencido { background: var(--peligro-suave); color: var(--peligro-tinta); }
.dash-prest strong { display: block; font-family: var(--fuente-titulo); font-size: 30px; line-height: 1; }
.dash-prest span { font-size: 12px; font-weight: 700; }
.dash-prest-lista { display: flex; flex-direction: column; gap: 6px; }
.dp-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; text-align: left; width: 100%;
  background: var(--superficie-2); font-size: 13px; transition: background var(--transicion);
}
.dp-item:hover { background: var(--superficie-3); }
.dp-item strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-item span { font-size: 11.5px; font-weight: 700; color: var(--tenue); }
.dp-item.vencido span { color: var(--peligro); }

.proy-valor { font-family: var(--fuente-titulo); font-size: 40px; font-weight: 700; line-height: 1; }
.proy-sub { font-size: 12.5px; color: var(--tinta-2); }
.proy-desglose { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.proy-item { padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; }
.proy-item.dan { background: var(--peligro-suave); color: var(--peligro-tinta); }
.proy-item.rep { background: var(--mant-suave); color: var(--mant-tinta); }
.proy-item .lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.proy-item .val { font-family: var(--fuente-titulo); font-size: 20px; font-weight: 700; }
.proy-detalle { color: var(--tenue); }

.atencion-list { display: flex; flex-direction: column; gap: 8px; }
.atencion-row { display: flex; align-items: center; gap: 8px; }
.atencion-item {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
  text-align: left; background: var(--superficie-2); border: 1.5px solid transparent; transition: border-color var(--transicion);
}
.atencion-item:hover { border-color: var(--borde); }
.atencion-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.d-mant { background: var(--mant); box-shadow: 0 0 0 4px var(--mant-suave); }
.d-dan { background: var(--peligro); box-shadow: 0 0 0 4px var(--peligro-suave); }
.atencion-body { flex: 1; min-width: 0; }
.atencion-name, .atencion-meta { display: block; }
.atencion-name { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.atencion-meta { font-size: 12px; color: var(--tenue); }
.atencion-badge { flex: none; }
.atencion-empty, .timeline-empty, .hist-vacio, .mapa-loading, .gs-vacio {
  padding: 18px; text-align: center; color: var(--tenue); font-size: 13.5px;
  border: 1.5px dashed var(--linea); border-radius: 12px;
}

.timeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tl-item { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--superficie-2); }
.tl-dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--primario); box-shadow: 0 0 0 4px var(--primario-suave); }
.tl-body { min-width: 0; }
.tl-name { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-meta { font-size: 12px; color: var(--tenue); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

/* Mientras llegan los datos por primera vez, los números "respiran" */
body.cargando-datos .metric-num, body.cargando-datos #statSalud, body.cargando-datos #proyTotal { animation: pulso 1.1s ease-in-out infinite; }
@keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* ---------- 8. TARJETAS, ESTADOS Y KPIs ---------- */
.card-panel { padding: 20px; min-width: 0; }
.card-panel h3 { font-size: 17px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.dash-card { padding: 18px; }
.paso-n {
  width: 28px; height: 28px; border-radius: 9px; flex: none; display: inline-grid; place-items: center;
  background: var(--acento); color: var(--noche); border: 1.5px solid var(--borde); font-family: var(--fuente-titulo); font-size: 14px;
}

.status {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 800; white-space: nowrap;
}
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-bueno { background: var(--ok-suave); color: var(--ok-tinta); }
.status-regular { background: var(--aviso-suave); color: var(--aviso-tinta); }
.status-danado { background: var(--peligro-suave); color: var(--peligro-tinta); }
.status-mantenimiento { background: var(--mant-suave); color: var(--mant-tinta); }
.status-baja { background: var(--baja-suave); color: var(--baja-tinta); }
.status-prestado { background: var(--prestado-suave); color: var(--prestado-tinta); }
.status-otro { background: var(--superficie-2); color: var(--tinta-2); }
.code-badge {
  font-family: var(--mono); font-size: 12px; padding: 3px 7px; border-radius: 7px;
  background: var(--superficie-2); border: 1px solid var(--linea); white-space: nowrap;
}

.mapa-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
.mapa-kpi {
  display: flex; flex-direction: column; gap: 4px; padding: 16px; text-align: left; border-radius: var(--radio);
  background: var(--superficie); border: 1.5px solid var(--borde); box-shadow: var(--sombra-dura-sm);
  transition: transform var(--transicion), box-shadow var(--transicion);
}
.mapa-kpi:not(:disabled):hover { transform: translate(-1px, -1px); box-shadow: var(--sombra-dura); }
.mapa-kpi:disabled { opacity: 1; cursor: default; }
.mapa-kpi strong { font-family: var(--fuente-titulo); font-size: 28px; line-height: 1.05; word-break: break-word; }
.mapa-kpi strong small { font-size: 15px; color: var(--tenue); }
.mapa-kpi span { font-size: 12px; font-weight: 700; color: var(--tinta-2); }
.mapa-kpi.k-alta strong { color: var(--ok); }
.mapa-kpi.k-media strong { color: var(--aviso); }
.mapa-kpi.k-baja strong { color: var(--peligro); }
.mapa-kpi.k-prestado strong { color: var(--prestado); }
.mapa-kpi.k-texto strong { font-size: 19px; }
.mapa-kpi.sel { background: var(--acento-suave); }
.t-alta { color: var(--ok); } .t-media { color: var(--aviso); } .t-baja { color: var(--peligro); }

/* ---------- 9. INVENTARIO Y TABLAS ---------- */
.products-card { overflow: hidden; }
.products-header {
  display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 20px; border-bottom: 1.5px solid var(--linea);
}
.products-header h2 { font-size: 19px; }
.products-count { font-size: 13px; color: var(--tenue); font-weight: 600; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters select, .gs-barra select {
  height: 42px; padding: 0 34px 0 12px; border-radius: 12px; border: 1.5px solid var(--linea);
  background: var(--superficie); max-width: 220px;
}
.search-box {
  display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; min-width: 220px;
  border-radius: 12px; border: 1.5px solid var(--linea); background: var(--superficie); color: var(--tenue);
  transition: border-color var(--transicion);
}
.search-box:focus-within { border-color: var(--primario); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--tinta); height: 100%; }
.table-wrapper { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabla th {
  position: sticky; top: 0; background: var(--superficie-2); text-align: left; padding: 11px 14px;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); white-space: nowrap;
}
.tabla td { padding: 12px 14px; border-top: 1px solid var(--linea); vertical-align: middle; }
.tabla tbody tr { transition: background var(--transicion); }
.tabla tbody tr:hover { background: var(--acento-suave); }
.tabla td small { color: var(--tenue); }
.celda-bien { display: flex; flex-direction: column; gap: 3px; }
.celda-bien .status { align-self: flex-start; }
.empty-state { padding: 40px 20px; text-align: center; color: var(--tenue); }
.empty-state h3 { margin-bottom: 4px; }
.mas-wrap { display: flex; justify-content: center; padding: 18px; }

/* ---------- 10. FORMULARIOS Y CHIPS ---------- */
.registrar-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form-field.full { grid-column: 1 / -1; }
.form-field label, .lbl-falso { font-size: 12.5px; font-weight: 800; color: var(--tinta-2); }
.form-field input, .form-field select, .form-field textarea, .campo-texto, .manual-id input, .gs-agregar input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
  border: 1.5px solid var(--linea); background: var(--superficie); color: var(--tinta);
  transition: border-color var(--transicion), box-shadow var(--transicion);
}
.form-field textarea { resize: vertical; min-height: 70px; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus, .campo-texto:focus,
.manual-id input:focus, .gs-agregar input:focus {
  outline: 0; border-color: var(--primario); box-shadow: 0 0 0 4px var(--primario-suave);
}
.form-field.con-error input, .form-field.con-error select, .form-field.con-error textarea {
  border-color: var(--peligro); box-shadow: 0 0 0 4px var(--peligro-suave);
}
.campo-error { font-size: 12px; font-weight: 700; color: var(--peligro); }
.campo-error:empty { display: none; }
.campo-ayuda { font-size: 12px; color: var(--tenue); }
.campo-ayuda:empty { display: none; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.form-hint {
  padding: 26px; text-align: center; border-radius: 14px; border: 1.5px dashed var(--linea);
  color: var(--tenue); background: var(--superficie-2);
}
.form-msg { font-size: 13px; font-weight: 700; margin-top: 10px; }
.form-msg:empty { display: none; }
.form-msg.error { color: var(--peligro); }
.form-msg.ok { color: var(--ok); }

#estadoIA {
  padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; font-weight: 700;
  background: var(--primario-suave); color: var(--primario);
}
.foto-botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.foto-botones > * { flex: 1 1 140px; }
.fotos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 14px; }
.fotos-vacio { grid-column: 1 / -1; padding: 30px; text-align: center; color: var(--tenue); border: 1.5px dashed var(--linea); border-radius: 12px; }
.foto-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--linea); }
.foto-item.principal { border: 2px solid var(--borde); box-shadow: var(--sombra-dura-sm); }
.foto-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-tag {
  position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px;
  background: var(--acento); color: var(--noche);
}
.foto-quitar {
  position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 8px;
  background: rgba(9, 30, 47, .75); color: #fff; font-weight: 800;
}
.fotos-contador { font-size: 12px; color: var(--tenue); margin-top: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 13px; border-radius: 999px;
  font-size: 13px; font-weight: 700; background: var(--superficie); color: var(--tinta-2);
  border: 1.5px solid var(--linea); transition: all var(--transicion);
}
.chip:hover { border-color: var(--borde); color: var(--tinta); }
.chip.on { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.chip-otro { border-style: dashed; }
.chips-hint { font-size: 13px; color: var(--tenue); }

.seg-toggle {
  display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px;
  background: var(--superficie-2); border: 1.5px solid var(--linea);
}
.seg-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 10px;
  font-size: 13px; font-weight: 800; color: var(--tinta-2); transition: all var(--transicion);
}
.seg-btn .ic { width: 17px; height: 17px; }
.seg-btn.on { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-dura-sm); border: 1.5px solid var(--borde); }
.seg-full { display: flex; width: 100%; }
.seg-full .seg-btn { flex: 1; }

/* ---------- 11. ESCÁNER, AUDITORÍA Y REPORTE ---------- */
.seg-toggle + .header-actions { margin-left: auto; }
.escaner-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.escaner-caja {
  position: relative; min-height: 270px; border-radius: 14px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; background: var(--noche);
  background-image: linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);
  background-size: 20px 20px;
}
#lectorQR { width: 100%; }
#lectorQR video { width: 100% !important; display: block; }
.escaner-placeholder {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px; text-align: center; color: var(--menu-texto); font-size: 13.5px;
}
.escaner-marco {
  width: 130px; height: 130px; border-radius: 18px; position: relative;
  background:
    linear-gradient(var(--acento), var(--acento)) top left / 34px 4px no-repeat,
    linear-gradient(var(--acento), var(--acento)) top left / 4px 34px no-repeat,
    linear-gradient(var(--acento), var(--acento)) top right / 34px 4px no-repeat,
    linear-gradient(var(--acento), var(--acento)) top right / 4px 34px no-repeat,
    linear-gradient(var(--acento), var(--acento)) bottom left / 34px 4px no-repeat,
    linear-gradient(var(--acento), var(--acento)) bottom left / 4px 34px no-repeat,
    linear-gradient(var(--acento), var(--acento)) bottom right / 34px 4px no-repeat,
    linear-gradient(var(--acento), var(--acento)) bottom right / 4px 34px no-repeat;
}
.escaner-marco::after {
  content: ''; position: absolute; left: 10px; right: 10px; top: 12px; height: 3px; border-radius: 3px;
  background: #4a91c9; box-shadow: 0 0 14px #4a91c9; animation: barrido 2.2s ease-in-out infinite;
}
@keyframes barrido { 0%, 100% { top: 12px; } 50% { top: calc(100% - 15px); } }
.btn-escanear { width: 100%; min-height: 54px; margin-top: 14px; font-size: 15px; }
.escaner-ayuda { font-size: 12px; color: var(--tenue); text-align: center; margin-top: 6px; }
.manual-id { display: flex; gap: 8px; margin-top: 14px; }
.manual-id input { flex: 1; min-width: 0; }
.escaner-estado { margin-top: 10px; min-height: 18px; font-size: 13px; font-weight: 700; color: var(--tinta-2); }

.scan-card {
  display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px;
  background: var(--superficie-2); border: 1.5px solid var(--linea);
}
.scan-card.scan-error { background: var(--peligro-suave); color: var(--peligro-tinta); border-color: transparent; }
.scan-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.scan-top strong { display: block; font-family: var(--fuente-titulo); font-size: 19px; }
.scan-id { font-family: var(--mono); font-size: 12px; color: var(--tenue); }
.scan-datos { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--tinta-2); }
.scan-datos.espaciado { margin: 12px 0; }
.scan-acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.aviso-prestamo {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
  background: var(--prestado-suave); color: var(--prestado-tinta);
}

.audit-head { display: flex; justify-content: space-between; align-items: center; }
.audit-head h3 { margin: 0; }
.audit-progreso { font-family: var(--fuente-titulo); font-weight: 700; font-size: 18px; }
.audit-resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.audit-box { padding: 12px; border-radius: 12px; text-align: center; }
.audit-box strong { display: block; font-family: var(--fuente-titulo); font-size: 26px; line-height: 1.1; }
.audit-box span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.audit-box.ok { background: var(--ok-suave); color: var(--ok-tinta); }
.audit-box.warn { background: var(--aviso-suave); color: var(--aviso-tinta); }
.audit-box.bad { background: var(--peligro-suave); color: var(--peligro-tinta); }
.audit-lista { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
.audit-item {

}
.audit-ic { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; font-weight: 800; background: var(--superficie-3); }
.audit-item.ok .audit-ic { background: var(--ok); color: #fff; }

.audit-nom { flex: 1; min-width: 0; font-weight: 700; }
.audit-nom small { display: block; font-weight: 500; color: var(--tenue); font-size: 11.5px; }
.audit-tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: var(--tenue); }

.rx-seleccion {

.rx-ia { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--tenue); }
.rx-ia.ok { color: var(--ok); font-weight: 700; }
.rx-ia.warn { color: var(--aviso); font-weight: 700; }
.rx-ia.bad { color: var(--peligro); font-weight: 700; }

/* ---------- 12. MAPA 2D ---------- */
.mapa-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
.mapa-toolbar .search-box { flex: 0 1 260px; }
.mapa-leyenda { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.leyenda-item { display: inline-flex; align-items: center; gap: 6px; }

.edificio {
  position: relative; margin-bottom: 18px; padding: 18px; border-radius: var(--radio);

}
.edificio::before {

}
.edificio-verde::before { background: var(--ok); }
.edificio-naranja::before { background: var(--aviso); }
.edificio-principal::before { background: var(--primario); }
.edificio-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.edificio-head strong { font-family: var(--fuente-titulo); font-size: 18px; }
.edificio-head span { font-size: 12px; color: var(--tenue); font-weight: 600; }
.planta { display: flex; gap: 10px; align-items: stretch; }
.planta + .planta { margin-top: 10px; }
.planta-lbl {

  font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;

}
.plano-grid {
  flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; padding: 8px;
  border-radius: 12px; background: var(--superficie-2);

}
.salon {
  position: relative; overflow: hidden; min-height: 96px; padding: 10px 10px 14px; border-radius: 11px; text-align: left;
  display: flex; flex-direction: column; gap: 2px; color: var(--tinta);

  transition: transform var(--transicion), box-shadow var(--transicion), border-color var(--transicion);
}
.salon:hover { transform: translate(-2px, -2px); box-shadow: var(--sombra-dura); border-color: var(--borde); z-index: 1; }
.salon.salud-alta { background: var(--ok-suave); }
.salon.salud-media { background: var(--aviso-suave); }
.salon.salud-baja { background: var(--peligro-suave); }
.salon.salud-vacia { border-style: dashed; color: var(--tenue); }
.salon-nombre { font-size: 12.5px; font-weight: 800; }
.salon-salud { font-family: var(--fuente-titulo); font-size: 22px; font-weight: 700; line-height: 1.1; }
.salon.salud-alta .salon-salud { color: var(--ok-tinta); }
.salon.salud-media .salon-salud { color: var(--aviso-tinta); }
.salon.salud-baja .salon-salud { color: var(--peligro-tinta); }
.salon-meta { font-size: 11px; color: var(--tinta-2); }

.barra-estados { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: flex; background: var(--superficie-3); }
.barra-estados.vacia { background: transparent; }

.b-bueno { background: var(--ok); }
.b-regular { background: var(--aviso); }
.b-danado { background: var(--peligro); }
.b-mantenimiento { background: var(--mant); }
.aula-sin {
  width: 100%; margin-top: 4px; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 13px;
  border: 1.5px dashed var(--peligro); background: var(--peligro-suave); color: var(--peligro-tinta);
}

.grafica-aulas { display: flex; flex-direction: column; gap: 4px; }
.grafica-aulas .section-label { margin-bottom: 10px; align-self: flex-start; }
.gbar-row {
  display: grid; grid-template-columns: 120px minmax(0, 1fr) 84px; align-items: center; gap: 12px;
  padding: 7px 6px; border-radius: 10px; text-align: left; transition: background var(--transicion);
}
.gbar-row:hover { background: var(--acento-suave); }
.gbar-lbl { font-size: 12.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gbar-track { display: block; height: 16px; border-radius: 8px; overflow: hidden; background: var(--superficie-2); }
.gbar-fill { display: flex; height: 100%; border-radius: 8px; overflow: hidden; }
.gbar-val { font-size: 12px; color: var(--tenue); text-align: right; }

.aula-detalle-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
.aula-nav { display: flex; gap: 6px; }
.aula-nav .secondary-button { padding: 8px 12px; }

.aula-resumen h2 { font-size: 30px; margin: 6px 0 2px; }
.aula-donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 16px; }
.aula-filtros { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.aula-filtro {
  display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 11px; font-size: 13px; font-weight: 700;
  background: var(--superficie-2); border: 1.5px solid transparent; color: var(--tinta-2);
}
.aula-filtro b { margin-left: auto; color: var(--tinta); }

.aula-valor { margin-top: 12px; text-align: center; font-size: 12px; color: var(--tenue); }
.aula-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.espacio-mueble {

  display: flex; flex-direction: column; gap: 4px; justify-content: space-between;

  transition: transform var(--transicion), box-shadow var(--transicion);
}
.espacio-mueble::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px; border-radius: 0 4px 4px 0; background: var(--ok); }

.espacio-mueble.tile-regular::before { background: var(--aviso); }
.espacio-mueble.tile-danado::before { background: var(--peligro); }
.espacio-mueble.tile-mantenimiento::before { background: var(--mant); }
.espacio-mueble.tile-danado { background: var(--peligro-suave); }
.espacio-mueble.tile-mantenimiento { background: var(--mant-suave); }
.mueble-nombre { font-size: 12.5px; font-weight: 800; line-height: 1.25; word-break: break-word; }
.mueble-id { font-family: var(--mono); font-size: 10.5px; color: var(--tenue); }
.mueble-estado { font-size: 11px; font-weight: 700; color: var(--tinta-2); }
.mueble-prestado { font-size: 10.5px; font-weight: 800; color: var(--prestado-tinta); }

/* ---------- 13. GESTIÓN ---------- */
.gs-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.gs-tab {
  padding: 9px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--tinta-2);
  background: var(--superficie); border: 1.5px solid var(--linea); transition: all var(--transicion);
}
.gs-tab:hover { border-color: var(--borde); color: var(--tinta); }
.gs-tab.on { background: var(--tinta); color: var(--papel); border-color: var(--tinta); box-shadow: 3px 3px 0 var(--acento); }
.gs-panel .card-panel { margin-bottom: 18px; }
#gsCargando { margin-bottom: 14px; }

.ciclo-linea { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.ciclo-flecha { align-self: center; color: var(--tenue); font-weight: 800; }
.ciclo-paso {
  display: flex; flex-direction: column; align-items: center; min-width: 92px; padding: 10px 12px 9px; border-radius: 12px;
  background: var(--superficie); border: 1.5px solid var(--linea); border-top: 5px solid var(--tenue);
  transition: transform var(--transicion), border-color var(--transicion);
}
.ciclo-paso:hover { transform: translateY(-2px); border-color: var(--borde); }
.ciclo-paso b { font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.1; }
.ciclo-paso span { font-size: 11.5px; font-weight: 700; color: var(--tenue); }
.c-excelente { border-top-color: #0b8a4a; }
.c-bueno { border-top-color: var(--ok); }
.c-regular { border-top-color: var(--aviso); }
.c-danado { border-top-color: var(--peligro); }
.c-mant { border-top-color: var(--mant); }
.c-parabaja { border-top-color: var(--baja); }
.c-debaja { border-top-color: var(--tinta); opacity: .75; }

.gs-barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.gs-barra .gs-nota { flex: 1; min-width: 240px; margin: 0; }
.gs-lista { max-height: 430px; overflow-y: auto; border-radius: 12px; border: 1.5px solid var(--linea); background: var(--superficie-2); }
.gs-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--linea); cursor: pointer; }
.gs-item:last-child { border-bottom: 0; }
.gs-item:hover { background: var(--acento-suave); }
.gs-item input, .gs-todos input { width: 18px; height: 18px; flex: none; accent-color: var(--primario); }
.gs-item-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gs-item-txt strong, .gs-item-txt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gs-item-txt strong { font-size: 13.5px; }
.gs-item-txt span { font-size: 12px; color: var(--tenue); }
.gs-tag { flex: none; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: var(--primario-suave); color: var(--primario); }
.gs-tag.t-mal { background: var(--peligro-suave); color: var(--peligro-tinta); }
.gs-tag.t-medio { background: var(--aviso-suave); color: var(--aviso-tinta); }
.gs-tag.t-gris { background: var(--superficie-3); color: var(--tinta-2); }
.gs-acciones { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.gs-acciones .gs-cuenta { margin-right: auto; }
.gs-todos { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
.gs-cuenta { font-size: 12.5px; color: var(--tenue); font-weight: 600; }
.gs-nota { margin-top: 10px; font-size: 13px; line-height: 1.55; color: var(--tinta-2); }
.gs-nota:empty { display: none; }
.gs-destinos { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
.gs-destino {
  display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; text-align: left;
  background: var(--superficie); border: 1.5px solid var(--linea); transition: all var(--transicion);
}
.gs-destino b { font-size: 14px; }
.gs-destino span { font-size: 12px; color: var(--tenue); }
.gs-destino:hover { border-color: var(--borde); }
.gs-destino.on { background: var(--acento); border-color: var(--borde); box-shadow: var(--sombra-dura-sm); }
.gs-destino.on b, .gs-destino.on span { color: var(--noche); }
.gs-agregar { margin-top: 20px; padding-top: 16px; border-top: 1.5px dashed var(--linea); }
.gs-agregar label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 800; color: var(--tinta-2); }
.gs-res { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--linea); font-size: 13px; }
.gs-res span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.gs-resumen { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.gs-pill { padding: 5px 11px; border-radius: 999px; font-size: 12.5px; background: var(--superficie-2); }

.kits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.kit-card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--radio);
  background: var(--superficie); border: 1.5px solid var(--borde); box-shadow: var(--sombra-dura);
}
.kit-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.kit-top div { display: flex; flex-direction: column; min-width: 0; }
.kit-top strong { font-family: var(--fuente-titulo); font-size: 17px; }
.kit-top div span { font-size: 11.5px; color: var(--tenue); font-family: var(--mono); }
.kit-aula { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--acento); color: var(--noche); }
.kit-n { font-size: 13px; color: var(--tenue); }
.kit-n b { font-family: var(--fuente-titulo); font-size: 24px; color: var(--tinta); }

.kit-acc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.kit-acc button { min-height: 36px; padding: 6px 12px; font-size: 13px; }
#kitEditor { margin-bottom: 18px; }
.av-tg { margin-top: 14px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--linea); background: var(--superficie-2); }
.av-tg summary { cursor: pointer; font-weight: 800; }
.av-tg ol { margin: 10px 0 12px 20px; font-size: 13px; line-height: 1.7; color: var(--tinta-2); }
.av-tg code { word-break: break-all; background: var(--superficie-3); padding: 1px 5px; border-radius: 5px; }

/* ---------- 14. PRÉSTAMOS ---------- */
.pr-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.pr-toolbar .search-box { flex: 1 1 280px; max-width: 420px; }
.pr-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.pr-lista > .mapa-loading, .pr-lista > .gs-vacio { grid-column: 1 / -1; }
.pr-card {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px;
  border-radius: var(--radio); background: var(--superficie); border: 1.5px solid var(--borde); box-shadow: var(--sombra-dura-sm);
}
/* Muesca de "boleto" a los lados */
.pr-card::before, .pr-card::after {
  content: ''; position: absolute; top: 58px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--papel); border: 1.5px solid var(--borde);
}
.pr-card::before { left: -9px; clip-path: inset(0 0 0 50%); }
.pr-card::after { right: -9px; clip-path: inset(0 50% 0 0); }
.pr-card.vencido { box-shadow: 4px 4px 0 var(--peligro); }
.pr-card.cerrado { opacity: .82; box-shadow: none; }
.pr-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1.5px dashed var(--linea); }
.pr-id { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--tenue); }
.pr-nombre { font-family: var(--fuente-titulo); font-size: 18px; line-height: 1.2; }
.pr-persona { font-size: 12.5px; color: var(--tinta-2); }
.pr-bienes { display: flex; flex-wrap: wrap; gap: 6px; }
.pr-bien { padding: 4px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--superficie-2); }
.pr-fechas { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--tinta-2); }
.pr-fechas b { color: var(--tinta); }
.pr-plazo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; flex: none; background: var(--prestado-suave); color: var(--prestado-tinta); }
.pr-plazo .ic { width: 15px; height: 15px; }
.pr-plazo.vencido { background: var(--peligro); color: #fff; }
.pr-plazo.hoy { background: var(--acento); color: var(--noche); }
.pr-plazo.cerrado { background: var(--superficie-2); color: var(--tinta-2); }
.pr-acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.pr-acciones .secondary-button, .pr-acciones .primary-button { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.est-activo { background: var(--prestado-suave); color: var(--prestado-tinta); }
.est-devuelto { background: var(--ok-suave); color: var(--ok-tinta); }
.est-perdido { background: var(--peligro-suave); color: var(--peligro-tinta); }
.est-nodevuelto { background: var(--aviso-suave); color: var(--aviso-tinta); }

.pr-paso { border: 0; margin-bottom: 18px; min-width: 0; }
.pr-paso legend { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-family: var(--fuente-titulo); font-size: 17px; font-weight: 700; }
.pr-agregar { display: flex; gap: 10px; flex-wrap: wrap; }
.pr-agregar .search-box { flex: 1 1 240px; }
.pr-resultados { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.pr-resultados:empty { display: none; }
.pr-res {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 11px;
  text-align: left; width: 100%; background: var(--superficie-2); font-size: 13px; border: 1.5px solid transparent;
}
.pr-res:hover:not(:disabled) { border-color: var(--borde); }
.pr-res span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-res small { color: var(--tenue); }

.pr-seleccion { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 40px; align-items: center; }
.pr-sel {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 999px;
  background: var(--acento); color: var(--noche); font-size: 13px; font-weight: 700; border: 1.5px solid var(--borde);
}

.pr-sel .ic { width: 14px; height: 14px; }

/* ---------- 15. MODALES, PALETA Y AVISO ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 18px;
  background: rgba(0, 16, 29, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  animation: aparece .2s ease;
}
.modal-box {
  width: 100%; max-width: 460px; max-height: calc(100vh - 36px); overflow-y: auto; padding: 22px;
  border-radius: 20px; background: var(--superficie); border: 1.5px solid var(--borde); box-shadow: 6px 6px 0 var(--borde);
