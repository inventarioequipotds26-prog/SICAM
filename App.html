/* ---------- 2. LIBRERÍAS (se descargan solo cuando se usan) ---------- */
const LIBS = {
  tf: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js',
  tfWasm: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.11.0/dist/tf-backend-wasm.min.js',
  mobilenet: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0',

  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
};
const scriptsCargando = {};

function cargarScript(url) {
  if (scriptsCargando[url]) return scriptsCargando[url];
  scriptsCargando[url] = new Promise(function (resolve, reject) {
    const s = document.createElement('script');
    s.src = url;
    s.onload = function () { resolve(); };
    s.onerror = function () { delete scriptsCargando[url]; reject(new Error('No se pudo descargar ' + url)); };
    document.head.appendChild(s);
  });
  return scriptsCargando[url];
}

function asegurarTF() {
  return cargarScript(LIBS.tf)
    .then(function () { return cargarScript(LIBS.tfWasm); })
    .then(function () { return cargarScript(LIBS.mobilenet); });
}
function asegurarQRCode() { return cargarScript(LIBS.qrcode); }
function asegurarEscaner() { return cargarScript(LIBS.escaner); }
function asegurarXLSX() { return cargarScript(LIBS.xlsx); }

/** Modelo de IA (MobileNet) compartido por Registrar y Reportar falla. Se carga una sola vez. */
let modelo = null;
let modeloPromesa = null;
function asegurarModelo() {
  if (modelo) return Promise.resolve(modelo);
  if (modeloPromesa) return modeloPromesa;
  modeloPromesa = (async function () {
    await asegurarTF();
    tf.wasm.setWasmPaths('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.11.0/dist/');
    tf.env().set('WEBGL_DELETE_TEXTURE_THRESHOLD', 0);
    tf.env().set('WASM_HAS_SIMD_SUPPORT', false);
    await tf.setBackend('wasm');
    await tf.ready();
    modelo = await mobilenet.load({ version: 1, alpha: 0.25 });
    return modelo;
  })();
  modeloPromesa.catch(function () { modeloPromesa = null; });
  return modeloPromesa;
}

function vectorDeCanvas(canvas) {
  return tf.tidy(function () {
    const tensor = tf.browser.fromPixels(canvas);
    return Array.from(modelo.infer(tensor, true).dataSync());
  });
}

/** Similitud de coseno entre dos "huellas" de IA (1 = idénticas) */
function calcularSimilitud(vecA, vecB) {
  if (!vecA || !vecB || vecA.length !== vecB.length) return 0;
  let punto = 0, normaA = 0, normaB = 0;
  for (let i = 0; i < vecA.length; i++) {
    punto += vecA[i] * vecB[i];
    normaA += vecA[i] * vecA[i];
    normaB += vecB[i] * vecB[i];
  }
  const denom = Math.sqrt(normaA) * Math.sqrt(normaB);
  return denom === 0 ? 0 : punto / denom;
}

/** Reduce una foto a 960 px (JPEG 70 %) y, si se pide, prepara un lienzo de 224 px para la IA */
function procesarImagen(archivo, necesitaIA) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = function () {
      try {
        const maxLado = 960;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxLado || h > maxLado) {
          if (w > h) { h = Math.round(h * maxLado / w); w = maxLado; }
          else { w = Math.round(w * maxLado / h); h = maxLado; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const data = c.toDataURL('image/jpeg', 0.7);
        let canvas224 = null;
        if (necesitaIA) {
          canvas224 = document.createElement('canvas');
          canvas224.width = 224; canvas224.height = 224;
          canvas224.getContext('2d').drawImage(c, 0, 0, 224, 224);
        }
        c.width = 0; c.height = 0;
        URL.revokeObjectURL(url);
        resolve({ data: data, canvas224: canvas224 });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/* ---------- 3. DATOS DE ACTIVOS EN MEMORIA ---------- */
// Se quitan comillas sobrantes por si la plantilla las dejó
const URL_APP = String(window.URL_APP || '').trim().replace(/^["']+|["']+$/g, '');
const FRESCURA_MS = 60 * 1000;
let activosCargadosEn = 0;
let activosPromesa = null;

/** Devuelve la lista de activos. Reusa la de memoria si tiene menos de 1 minuto. */
function obtenerActivos(forzar) {
  if (!forzar && activosCargadosEn && (Date.now() - activosCargadosEn) < FRESCURA_MS) {
    return Promise.resolve(todosLosActivos);
  }
  if (activosPromesa && !forzar) return activosPromesa;
  activosPromesa = new Promise(function (resolve) {
    google.script.run
      .withSuccessHandler(function (lista) {
        todosLosActivos = lista || [];
        activosCargadosEn = Date.now();
        activosPromesa = null;
        resolve(todosLosActivos);
      })
      .withFailureHandler(function (err) {
        console.warn('No se pudieron leer los activos:', err);
        activosPromesa = null;
        resolve(todosLosActivos);
      })
      .obtenerListaActivos(!!forzar);
  });
  return activosPromesa;
}

/** Carga los activos y refresca Inicio e Inventario */
let primeraCarga = true;
function cargarActivos(forzar) {
  if (primeraCarga) document.body.classList.add('cargando-datos');
  return obtenerActivos(forzar).then(function () {
    primeraCarga = false;
    document.body.classList.remove('cargando-datos');
    actualizarDashboard();
    renderInventario();
  });
}

/** Normaliza un ID: sin espacios raros, guiones uniformes y en mayúsculas */
function idNorm(v) {
  return String(v == null ? '' : v)
    .replace(/[   ﻿​\s]/g, '')
    .replace(/[‐-—−]/g, '-')
    .toUpperCase();
}

/** "De Baja (…)" = ya salió del inventario; no cuenta en salud, mapa ni proyección */
function esDeBaja(estado) { return /^\s*de baja/i.test(String(estado || '')); }
function activosVigentes() { return todosLosActivos.filter(function (a) { return !esDeBaja(a.estado); }); }

function buscarActivoLocal(id) {
  const b = idNorm(id);
  if (!b) return null;
  return todosLosActivos.find(function (a) { return idNorm(a.id) === b; }) || null;
}

/** Listas de la hoja (aulas, estados, categorías, personal y bienes del manual), pedidas una vez */
let listasPromesa = null;
function obtenerListasSicam() {
  if (listasPromesa) return listasPromesa;
  listasPromesa = new Promise(function (resolve) {
    google.script.run
      .withSuccessHandler(function (l) { resolve(l || {}); })
      .withFailureHandler(function (err) { console.warn('Listas:', err); listasPromesa = null; resolve({}); })
      .obtenerListas();
  });
  return listasPromesa;
}

/* ---------- 4. UTILIDADES ---------- */
function escapeHTML(texto) {
  return String(texto == null ? '' : texto)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** Ícono del sprite de Index: icono('editar') */
function icono(nombre) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + nombre + '"/></svg>'; }

/** Botón que llama a una función por data-accion (ver sección 8) */
/* Acciones que solo puede usar el administrador: sus botones llevan data-solo="admin"
   (css/Estilos los oculta para los demás roles) y ejecutar() también las bloquea. */
const ACCIONES_ADMIN = ['abrirEditarActivo', 'abrirReparado', 'prestarBien', 'nuevoPrestamo', 'abrirMoverKit', 'abrirEditorKit',
  'eliminarKitUI', 'proponerBajaUno', 'proponerBajaSeleccion', 'abrirModalMant', 'abrirDevolucion', 'abrirPerdida', 'editarPrestamoUI',
  'eliminarPrestamoUI', 'guardarDatos', 'imprimirQR'];
const ACCIONES_SUPERVISION = ['guardarAuditoriaUI', 'registrarBajaUI', 'informeDireccion', 'exportarCSV', 'exportarExcel', 'exportarPDF'];

function botonAccion(clase, accion, arg, contenido, extra) {
  const solo = ACCIONES_ADMIN.indexOf(accion) >= 0 ? ' data-solo="admin"' :
    (ACCIONES_SUPERVISION.indexOf(accion) >= 0 ? ' data-solo="admin directivo"' : '');
  return '<button type="button" class="' + clase + '" data-accion="' + accion + '"' + solo +
    (arg != null ? ' data-arg="' + escapeHTML(arg) + '"' : '') + (extra || '') + '>' + contenido + '</button>';
}

function claseEstado(estado) {
  const e = String(estado || '').toLowerCase();
  if (e.indexOf('baja') >= 0) return 'status-baja';
  if (e.indexOf('buen') >= 0 || e.indexOf('excelente') >= 0) return 'status-bueno';
  if (e.indexOf('regular') >= 0) return 'status-regular';
  if (e.indexOf('dañ') >= 0 || e.indexOf('dan') >= 0) return 'status-danado';
  if (e.indexOf('manten') >= 0) return 'status-mantenimiento';
  return 'status-otro';
}

function necesitaReparar(estado) {
  const e = String(estado || '').toLowerCase();
  if (e.indexOf('baja') >= 0) return false;
  return e.indexOf('manten') >= 0 || e.indexOf('dañ') >= 0 || e.indexOf('dan') >= 0 || e.indexOf('roto') >= 0;
}

function dinero(n) { return '$' + (Number(n) || 0).toFixed(2); }
function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }

/** Aplica los anchos de las barras dibujadas por JS (data-w = %, data-flex = proporción) */
function pintarAnchos(raiz) {
  if (!raiz) return;
  requestAnimationFrame(function () {
    raiz.querySelectorAll('[data-w]').forEach(function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
    raiz.querySelectorAll('[data-flex]').forEach(function (el) { el.style.flex = el.getAttribute('data-flex'); });
  });
}

/** Fecha de hoy + n días en formato del formulario (aaaa-mm-dd) */
function fechaIsoMas(dias) {
  const d = new Date();
  d.setDate(d.getDate() + (Number(dias) || 0));
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function usuarioSesion() {
  try { return JSON.parse(localStorage.getItem('sicamUser') || '{}'); } catch (e) { return {}; }
}
function nombreUsuarioActual() { return usuarioSesion().nombre || ''; }
/** Llave de la sesión: el servidor la usa para saber quién eres y qué rol tienes */
function tokenSesion() { return usuarioSesion().token || ''; }

/* Roles: 'admin' (Administrador), 'directivo' (Dirección/Subdirección) y 'usuario' (docentes).
   La pantalla se adapta al rol, pero quien decide de verdad es el servidor (server/Sesion.gs). */
function rolActual() {
  const r = String(usuarioSesion().rol || '').toLowerCase();
  if (r.indexOf('admin') >= 0) return 'admin';
  if (r.indexOf('direct') >= 0) return 'directivo';
  return 'usuario';
}
function esAdminUI() { return rolActual() === 'admin'; }
/** Administrador o directivo: pueden ver préstamos, gestión, auditar e imprimir informes */
function puedeSupervisar() { return rolActual() !== 'usuario'; }

/** Llama una función del servidor y siempre resuelve con un objeto { exito, mensaje, … } */
function llamar(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.sesionVencida) sesionVencida(r.mensaje);
        resolve(r || { exito: false, mensaje: 'El servidor no respondió.' });
      })
      .withFailureHandler(function (err) { resolve({ exito: false, mensaje: 'Error: ' + (err && err.message || err) }); })[fn].apply(null, args);
  });
}

let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
}

/** Pone en la hoja imprimible el HTML dado y abre la ventana de impresión (o "Guardar como PDF") */
function imprimirHoja(html) {
  document.getElementById('informeImprimible').innerHTML = html;
  document.body.classList.add('modo-informe');
  const limpiar = function () { document.body.classList.remove('modo-informe'); window.removeEventListener('afterprint', limpiar); };
  window.addEventListener('afterprint', limpiar);
  setTimeout(function () { window.print(); setTimeout(limpiar, 1000); }, 60);
}

/* Observaciones comunes por bien (las usan Registrar y Reportar falla) */
const obsCache = {};
function toggleChip(btn) { btn.classList.toggle('on'); }

/* ---------- 5. SESIÓN ---------- */
let correoActual = '';

function checkAuth() {
  const overlay = document.getElementById('loginOverlay');
  let user = null;
  try { user = JSON.parse(localStorage.getItem('sicamUser') || 'null'); } catch (e) { localStorage.removeItem('sicamUser'); }
  // Sin llave (token) no hay sesión: las sesiones de versiones anteriores vuelven a iniciar
  if (!user || !user.nombre || !user.token) {
    if (user) localStorage.removeItem('sicamUser');
    document.body.classList.remove('rol-admin', 'rol-directivo', 'rol-usuario');
    overlay.classList.add('visible');
    irAPaso('correo');
    return false;
  }
  overlay.classList.remove('visible');
  aplicarUsuarioUI(user);
  return true;
}

/** Al abrir, pregunta al servidor el rol vigente (por si el administrador lo cambió) */
function refrescarSesion() {
  const t = tokenSesion();
  if (!t) return;
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r) return;
      if (r.sesionVencida) { sesionVencida(r.mensaje); return; }
      const u = usuarioSesion();
      if (r.rol === u.rol && r.nombre === u.nombre) return;
      u.rol = r.rol; u.nombre = r.nombre;
      try { localStorage.setItem('sicamUser', JSON.stringify(u)); } catch (e) {}
      aplicarUsuarioUI(u);
      mostrarVista(vistaActual);
      showToast('Tu rol ahora es: ' + r.rol);
    })
    .withFailureHandler(function () {})
    .obtenerSesion(t);
}

/** La llave venció o la cuenta se borró: vuelve a pedir inicio de sesión */
function sesionVencida(mensaje) {
  localStorage.removeItem('sicamUser');
  checkAuth();
  showToast(mensaje || 'Tu sesión venció. Vuelve a iniciar sesión.');
}

const ROL_TEXTO = {
  admin: { chip: 'Administrador', hero: 'Panel del administrador', desc: 'Tienes control total: registra, edita, presta y configura el inventario.' },
  directivo: { chip: 'Directivo', hero: 'Panel de Dirección', desc: 'Revisa el estado del centro escolar, autoriza bajas e imprime el informe para Dirección.' },
  usuario: { chip: 'Usuario', hero: 'Panel del docente', desc: 'Consulta el inventario, escanea códigos QR y reporta lo que esté dañado.' }
};

function aplicarUsuarioUI(user) {
  const avatar = document.getElementById('userAvatar');
  document.getElementById('userNameDisplay').textContent = user.nombre || 'Usuario';
  const rol = rolActual();
  document.body.classList.remove('rol-admin', 'rol-directivo', 'rol-usuario');
  document.body.classList.add('rol-' + rol);
  const chip = document.getElementById('userRoleDisplay');
  chip.textContent = ROL_TEXTO[rol].chip;
  chip.className = 'user-role rol-chip rol-chip-' + rol;
  document.getElementById('heroRol').textContent = ROL_TEXTO[rol].hero;
  document.getElementById('heroDesc').textContent = ROL_TEXTO[rol].desc;
  if (user.foto) avatar.innerHTML = '<img src="' + escapeHTML(user.foto) + '" alt="" referrerpolicy="no-referrer">';
  else avatar.textContent = (user.nombre || 'U').charAt(0).toUpperCase();
  const h = new Date().getHours();
  const parte = h < 12 ? 'Buenos días' : (h < 19 ? 'Buenas tardes' : 'Buenas noches');
  document.getElementById('saludoNombre').textContent = parte + ', ' + (user.nombre || 'usuario').split(' ')[0];
  document.getElementById('saludoFecha').textContent = new Date().toLocaleDateString('es-SV', { weekday: 'long', day: 'numeric', month: 'long' });
}

function guardarSesion(user) {
  try {
    localStorage.setItem('sicamUser', JSON.stringify({
      nombre: user.nombre, rol: user.rol, email: user.email || '',
      metodo: user.metodo || 'email', foto: user.foto || '', token: user.token || ''
    }));
  } catch (e) {}
  if (checkAuth()) mostrarVista('inicio');
  cargarActivos(true);
}

function irAPaso(paso) {
  const ids = { correo: 'pasoCorreo', clave: 'pasoClave', registro: 'pasoRegistro' };
  Object.keys(ids).forEach(function (p) { document.getElementById(ids[p]).classList.toggle('hidden', p !== paso); });
  ['errUser', 'errPass', 'errReg'].forEach(function (id) { ponerError(id, ''); });
  const foco = { correo: 'loginUser', clave: 'loginPass', registro: 'regNombre' }[paso];
  setTimeout(function () { const el = document.getElementById(foco); if (el) el.focus(); }, 60);
}

function ponerError(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg ? '⚠ ' + msg : '';
  const campo = el.previousElementSibling;
  if (campo && campo.classList.contains('g-campo')) campo.classList.toggle('con-error', !!msg);
}

function cargando(si) { document.getElementById('gProgreso').classList.toggle('activo', !!si); }

/** Acepta true/false o el evento "change" de la casilla */
function mostrarClaves(valor) {
  const ver = typeof valor === 'boolean' ? valor : !!(valor && valor.target && valor.target.checked);
  ['loginPass', 'regPass', 'regPass2'].forEach(function (id) { document.getElementById(id).type = ver ? 'text' : 'password'; });
}

function olvideContrasena() {
  showToast('Pide al administrador que restablezca tu contraseña en la hoja Usuarios.');
}

/** Paso 1: verifica que la cuenta exista y pasa a la contraseña */
function pasoCorreoSiguiente() {
  const user = document.getElementById('loginUser').value.trim();
  if (!user) { ponerError('errUser', 'Ingresa un correo o usuario.'); return; }
  const btn = document.getElementById('btnSiguienteCorreo');
  btn.disabled = true; cargando(true);
  google.script.run
    .withSuccessHandler(function (r) {
      btn.disabled = false; cargando(false);
      if (!r || !r.existe) { ponerError('errUser', (r && r.mensaje) || 'No encontramos esa cuenta.'); return; }
      if (r.soloGoogle) { ponerError('errUser', 'Esta cuenta usa Google. Presiona “Continuar con Google”.'); return; }
      correoActual = user;
      document.getElementById('chipCorreo').textContent = user;
      document.getElementById('chipAvatar').textContent = (r.nombre || user).charAt(0).toUpperCase();
      document.getElementById('claveTitulo').textContent = r.nombre ? 'Hola, ' + r.nombre.split(' ')[0] : 'Te damos la bienvenida';
      document.getElementById('loginPass').value = '';
      irAPaso('clave');
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; cargando(false);
      ponerError('errUser', 'Sin conexión con el servidor: ' + (err.message || err));
    })
    .verificarCuenta(user);
}

function iniciarSesion() {
  const pass = document.getElementById('loginPass').value;
  if (!pass) { ponerError('errPass', 'Ingresa tu contraseña.'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; cargando(true);
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; cargando(false);
      if (res && res.exito) { guardarSesion(res); showToast('Bienvenido, ' + (res.nombre || '')); }
      else ponerError('errPass', (res && res.mensaje) || 'Contraseña incorrecta.');
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; cargando(false);
      ponerError('errPass', 'Sin conexión con el servidor: ' + (err.message || err));
    })
    .validarUsuario(correoActual, pass);
}

function registrarCuenta() {
  const nombre = document.getElementById('regNombre').value.trim();
  const user = document.getElementById('regUser').value.trim();
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  if (nombre.length < 3) { ponerError('errReg', 'Ingresa tu nombre completo.'); return; }
  if (!user) { ponerError('errReg', 'Ingresa un correo o usuario.'); return; }
  if (user.indexOf('@') >= 0 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(user)) { ponerError('errReg', 'El correo no es válido.'); return; }
  if (pass.length < 6) { ponerError('errReg', 'La contraseña debe tener al menos 6 caracteres.'); return; }
  if (pass !== pass2) { ponerError('errReg', 'Las contraseñas no coinciden.'); return; }
  const btn = document.getElementById('btnRegister');
  btn.disabled = true; cargando(true);
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; cargando(false);
      if (res && res.exito) { showToast(res.mensaje || 'Cuenta creada'); guardarSesion(res); }
      else ponerError('errReg', (res && res.mensaje) || 'No se pudo crear la cuenta.');
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; cargando(false);
      ponerError('errReg', 'Sin conexión con el servidor: ' + (err.message || err));
    })
    .registrarUsuario({ usuario: user, contrasena: pass, nombre: nombre });
}

/**
 * Continuar con Google: el servidor da la dirección de Google y la ventana completa va allí.
 * Google regresa a esta Web App con ?code=…, el servidor confirma el correo y la página guarda la sesión.
 */
function iniciarConGoogle() {
  cargando(true);
  document.querySelectorAll('.g-google').forEach(function (b) { b.disabled = true; });
  const listo = function () { cargando(false); document.querySelectorAll('.g-google').forEach(function (b) { b.disabled = false; }); };
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.directo) {
        google.script.run
          .withSuccessHandler(function (res) { listo(); if (res && res.exito) guardarSesion(res); else showToast((res && res.mensaje) || 'No se pudo iniciar con Google'); })
          .withFailureHandler(function (err) { listo(); showToast('Error: ' + (err.message || err)); })
          .loginGoogleSesion();
        return;
      }
      if (r && r.url) { window.top.location.href = r.url; return; }
      listo();
      showToast((r && r.error) || 'No se pudo iniciar con Google.');
    })
    .withFailureHandler(function (err) { listo(); showToast('Error: ' + (err.message || err)); })
    .obtenerUrlLoginGoogle();
}

/** Si la página se abrió de regreso desde Google, guarda la sesión */
function procesarRegresoGoogle() {
  let r = null;
  try { r = window.LOGIN_GOOGLE ? JSON.parse(window.LOGIN_GOOGLE) : null; } catch (e) {}
  if (!r) return;
  if (r.exito) { guardarSesion(r); showToast((r.nuevo ? 'Cuenta creada · ' : '') + 'Hola, ' + (r.nombre || '')); return; }
  if (!localStorage.getItem('sicamUser')) showToast(r.mensaje || 'No se pudo iniciar con Google.');
}

function cerrarSesion() {
  const t = tokenSesion();
  if (t) google.script.run.withFailureHandler(function () {}).cerrarSesionServidor(t);
  localStorage.removeItem('sicamUser');
  if (URL_APP) window.top.location.href = URL_APP; else window.location.reload();
}

/* ---------- 6. NAVEGACIÓN, MENÚ Y TEMA ---------- */
const VISTAS = {
  inicio: 'vistaInicio', inventario: 'vistaInventario', mapa: 'vistaMapa', registrar: 'vistaRegistrar',
  qr: 'vistaQR', escanear: 'vistaEscanear', reporte: 'vistaReporte', gestion: 'vistaGestion',
  prestamos: 'vistaPrestamos', ayuda: 'vistaAyuda'
};
const TITULOS = {
  inicio: 'Inicio', inventario: 'Inventario', mapa: 'Mapa 2D', registrar: 'Registrar bien', qr: 'Etiquetas QR',
  escanear: 'Escanear QR', reporte: 'Reportar falla', gestion: 'Gestión', prestamos: 'Préstamos', ayuda: 'Guía de uso'
};

/* Vistas que puede abrir cada rol (el servidor vuelve a revisar cada acción) */
const VISTAS_POR_ROL = {
  usuario: ['inicio', 'inventario', 'mapa', 'escanear', 'reporte', 'ayuda'],
  directivo: ['inicio', 'inventario', 'mapa', 'escanear', 'reporte', 'prestamos', 'gestion', 'ayuda'],
  admin: Object.keys(VISTAS)
};
function puedeVer(nombre) { return VISTAS_POR_ROL[rolActual()].indexOf(nombre) >= 0; }

function mostrarVista(nombre) {
  if (!VISTAS[nombre]) nombre = 'inicio';
  if (!puedeVer(nombre)) {
    if (tokenSesion()) showToast('Esa sección es solo para ' + (nombre === 'prestamos' || nombre === 'gestion' ? 'Dirección y administración.' : 'el administrador.'));
    nombre = 'inicio';
  }
  vistaActual = nombre;
  document.querySelectorAll('.vista').forEach(function (v) { v.classList.toggle('activa', v.id === VISTAS[nombre]); });
  document.querySelectorAll('.nav-link[data-vista]').forEach(function (n) { n.classList.toggle('active', n.dataset.vista === nombre); });
  document.title = 'SICAM · ' + TITULOS[nombre];
  if (nombre !== 'escanear') detenerCamara();
  cerrarMenu();

  if (nombre === 'inicio') { cargarActivos(); if (puedeSupervisar()) cargarPrestamos(); }
  if (nombre === 'inventario') cargarActivos();
  if (nombre === 'registrar') { cargarListas(); inicializarIA(); }
  if (nombre === 'mapa') cargarMapa();
  if (nombre === 'qr') cargarQR();
  if (nombre === 'escanear') prepararEscaner();
  if (nombre === 'reporte') prepararReporte();
  if (nombre === 'gestion') cargarGestion();
  if (nombre === 'prestamos') { obtenerActivos(); cargarPrestamos(); }
  window.scrollTo(0, 0);
}

function abrirMenu() {
  sidebar.classList.add('open');
  document.getElementById('menuVelo').classList.add('visible');
}
function cerrarMenu() {
  sidebar.classList.remove('open');
  document.getElementById('menuVelo').classList.remove('visible');
}
menuToggle.addEventListener('click', abrirMenu);

function alternarTema() {
  const oscuro = document.documentElement.getAttribute('data-theme') !== 'oscuro';
  document.documentElement.setAttribute('data-theme', oscuro ? 'oscuro' : 'claro');
  try { localStorage.setItem('sicamTema', oscuro ? 'oscuro' : 'claro'); } catch (e) {}
  actualizarBotonTema();
}
function actualizarBotonTema() {
  const oscuro = document.documentElement.getAttribute('data-theme') === 'oscuro';
  document.getElementById('btnTema').title = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
}

/* ---------- 7. BUSCADOR GLOBAL (Ctrl + K) ---------- */
const ACCIONES_PALETA = [
  { t: 'Ir a Inicio', ic: 'inicio', f: function () { mostrarVista('inicio'); } },
  { t: 'Ir a Inventario', ic: 'caja', f: function () { mostrarVista('inventario'); } },
  { t: 'Abrir el mapa 2D', ic: 'mapa', f: function () { mostrarVista('mapa'); } },
  { t: 'Escanear un código QR', ic: 'escanear', f: function () { mostrarVista('escanear'); } },
  { t: 'Reportar una falla', ic: 'alerta', f: function () { mostrarVista('reporte'); } },
  { t: 'Nuevo préstamo', ic: 'prestamo', rol: 'admin', f: function () { nuevoPrestamo(); } },
  { t: 'Ver préstamos', ic: 'prestamo', rol: 'admin directivo', f: function () { mostrarVista('prestamos'); } },
  { t: 'Informe para Dirección', ic: 'imprimir', rol: 'admin directivo', f: function () { informeDireccion(); } },
  { t: 'Gestión: mantenimiento, bajas y kits', ic: 'gestion', rol: 'admin directivo', f: function () { mostrarVista('gestion'); } },
  { t: 'Usuarios y roles', ic: 'persona', rol: 'admin', f: function () { mostrarVista('gestion'); gsTab('usuarios'); } },
  { t: 'Registrar un bien', ic: 'mas', rol: 'admin', f: function () { mostrarVista('registrar'); } },
  { t: 'Imprimir etiquetas QR', ic: 'qr', rol: 'admin', f: function () { mostrarVista('qr'); } },
  { t: 'Exportar inventario a Excel', ic: 'descargar', rol: 'admin directivo', f: function () { mostrarVista('inventario'); exportarExcel(); } },
  { t: 'Cambiar modo claro / oscuro', ic: 'luna', f: function () { alternarTema(); } },
  { t: 'Guía de uso', ic: 'ayuda', f: function () { mostrarVista('ayuda'); } }
];
let paletaItems = [];
let paletaSel = 0;

function abrirPaleta() {
  const velo = document.getElementById('paleta');
  const inp = document.getElementById('paletaInput');
  velo.classList.remove('hidden');
  inp.value = '';
  renderPaleta();
  obtenerActivos().then(function () { if (!velo.classList.contains('hidden')) renderPaleta(); });
  setTimeout(function () { inp.focus(); }, 30);
}
function cerrarPaleta() { document.getElementById('paleta').classList.add('hidden'); }

function sinTildes(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function renderPaleta() {
  const q = sinTildes(document.getElementById('paletaInput').value.trim());
  const coincide = function (texto) { return !q || sinTildes(texto).indexOf(q) >= 0; };
  paletaItems = [];
  ACCIONES_PALETA.filter(function (a) { return (!a.rol || a.rol.indexOf(rolActual()) >= 0) && coincide(a.t); }).slice(0, q ? 5 : 8)
    .forEach(function (a) { paletaItems.push({ grupo: 'Acciones', t: a.t, sub: '', ic: a.ic, f: a.f }); });
  if (q.length >= 2) {
    const aulas = {};
    todosLosActivos.forEach(function (a) { if (a.ubicacion) aulas[a.ubicacion] = (aulas[a.ubicacion] || 0) + 1; });
    Object.keys(aulas).filter(coincide).slice(0, 4).forEach(function (n) {
      paletaItems.push({ grupo: 'Aulas', t: n, sub: plural(aulas[n], 'bien', 'bienes'), ic: 'plano', f: function () { irAAula(n); } });
    });
    todosLosActivos.filter(function (a) { return coincide(a.nombre + ' ' + a.id + ' ' + a.ubicacion); }).slice(0, 6).forEach(function (a) {
      paletaItems.push({ grupo: 'Bienes', t: a.nombre + ' · ' + a.id, sub: a.ubicacion || '', ic: 'caja', f: function () { abrirMueble(a.id); } });
    });
    (puedeSupervisar() ? prestamos || [] : []).filter(function (p) { return coincide(p.id + ' ' + p.nombre + ' ' + p.documento); }).slice(0, 4).forEach(function (p) {
      paletaItems.push({ grupo: 'Préstamos', t: p.id + ' · ' + p.nombre, sub: p.estado, ic: 'prestamo', f: function () { verPrestamo(p.id); } });
    });
  }
  paletaSel = 0;
  const cont = document.getElementById('paletaRes');
  if (!paletaItems.length) { cont.innerHTML = '<div class="paleta-vacio">Sin resultados para “' + escapeHTML(q) + '”.</div>'; return; }
  let grupo = '';
  cont.innerHTML = paletaItems.map(function (it, i) {
    const cab = it.grupo !== grupo ? '<div class="paleta-grupo">' + it.grupo + '</div>' : '';
    grupo = it.grupo;
    return cab + '<button type="button" class="paleta-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' +
      icono(it.ic) + '<span>' + escapeHTML(it.t) + '</span><small>' + escapeHTML(it.sub) + '</small></button>';
  }).join('');
}

function ejecutarPaleta(i) {
  const it = paletaItems[i];
  if (!it) return;
  cerrarPaleta();
  it.f();
}

function moverSeleccionPaleta(paso) {
  const botones = document.querySelectorAll('#paletaRes .paleta-item');
  if (!botones.length) return;
  paletaSel = (paletaSel + paso + botones.length) % botones.length;
  botones.forEach(function (b, i) { b.classList.toggle('sel', i === paletaSel); });
  botones[paletaSel].scrollIntoView({ block: 'nearest' });
}

document.getElementById('paletaInput').addEventListener('input', renderPaleta);
document.getElementById('paletaInput').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); moverSeleccionPaleta(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moverSeleccionPaleta(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); ejecutarPaleta(paletaSel); }
});
document.getElementById('paletaRes').addEventListener('click', function (e) {
  const b = e.target.closest('.paleta-item');
  if (b) ejecutarPaleta(Number(b.dataset.i));
});

/* ---------- 8. EVENTOS DECLARATIVOS Y ARRANQUE ----------
   En el HTML no hay onclick: cada botón dice qué hacer con atributos data-*.
     data-accion="funcion"  (+ data-arg="texto" o data-num="número")  → llama funcion(arg)
     data-abrir="idInput"   → abre el selector de archivo (cámara o galería)
     data-fondo="funcion"   → en un modal, se cierra al tocar fuera de la caja
     data-cambio="funcion"  → al cambiar un campo, llama funcion(evento)
     data-enviar="funcion"  → al enviar un formulario, llama funcion(evento)          */
function ejecutar(nombre, args) {
  if ((ACCIONES_ADMIN.indexOf(nombre) >= 0 && !esAdminUI()) || (ACCIONES_SUPERVISION.indexOf(nombre) >= 0 && !puedeSupervisar())) {
    showToast('Tu rol no permite esta acción.');
    return;
  }
  const fn = window[nombre];
  if (typeof fn !== 'function') { console.warn('Acción desconocida:', nombre); return; }
  fn.apply(null, args);
}

document.addEventListener('click', function (e) {
  const fondo = e.target.closest('[data-fondo]');
  if (fondo && e.target === fondo) { ejecutar(fondo.dataset.fondo, []); return; }
  const abrir = e.target.closest('[data-abrir]');
  if (abrir) { document.getElementById(abrir.dataset.abrir).click(); return; }
  const el = e.target.closest('[data-accion]');
  if (!el || el.disabled) return;
  let args = [];
  if (el.hasAttribute('data-num')) args = [Number(el.dataset.num)];
  else if (el.hasAttribute('data-arg')) args = [el.dataset.arg];
  ejecutar(el.dataset.accion, args);
});
document.addEventListener('change', function (e) {
  const el = e.target.closest('[data-cambio]');
  if (el) ejecutar(el.dataset.cambio, [e]);
});
document.addEventListener('submit', function (e) {
  const el = e.target.closest('[data-enviar]');
  if (!el) return;
  e.preventDefault();
  ejecutar(el.dataset.enviar, [e]);
});

/* Teclado: Ctrl+K abre el buscador, Esc cierra lo que esté abierto, Enter avanza en el login */
const MODALES = ['modalCerrarPr', 'modalPrestamo', 'modalActivo', 'modalReparado', 'muebleModal', 'modalMant', 'modalKit'];
document.addEventListener('keydown', function (e) {
  const login = document.getElementById('loginOverlay');
  if (login.classList.contains('visible')) {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('pasoCorreo').classList.contains('hidden')) pasoCorreoSiguiente();
    else if (!document.getElementById('pasoClave').classList.contains('hidden')) iniciarSesion();
    else registrarCuenta();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); abrirPaleta(); return; }
  if (e.key !== 'Escape') return;
  if (!document.getElementById('paleta').classList.contains('hidden')) { cerrarPaleta(); return; }
  const abierto = MODALES.find(function (id) { return !document.getElementById(id).classList.contains('hidden'); });
  if (abierto) { document.getElementById(abierto).classList.add('hidden'); return; }
  cerrarMenu();
});

window.addEventListener('load', function () {
  actualizarBotonTema();
  checkAuth();
  procesarRegresoGoogle();
  mostrarVista(String(window.VISTA_INICIAL || 'inicio').replace(/["']/g, ''));
  refrescarSesion();
});
